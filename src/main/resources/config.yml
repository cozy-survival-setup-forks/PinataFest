# PinataFest - config.yml
# Every vote counts towards a pinata party. Reload with /pinatafest reload.
# Durations look like 30s, 10m, 3h; a plain 0 switches a time limit off.
#
# In every reward command %player% is the player, %service% is the vote site (or "pinata")
# and %votes% is their total number of votes.

votes:
  # Turn this off if another plugin already handles votes.
  listen: true

  offline:
    # Votes always count for the pinata and for the player's total, online or not.
    # This decides whether the vote rewards are also kept for offline players
    # and paid out when they log in.
    queue_rewards: true
    # The most vote rewards kept per player. 0 means no limit.
    max_queue: 0

  # Votes are also counted per month for %pinatafest_votes_monthly%, and every count goes back to zero on the
  # first of the month, at midnight in this time zone (a name like America/New_York or UTC). If the server was
  # off at midnight the reset happens when it starts. /pinatafest monthly reset global does it by hand.
  monthly:
    timezone: America/New_York

  # Votes from several sites usually arrive together. The vote message (vote_broadcast in lang.yml) waits this
  # many ticks and then says "voted 3 times" once instead of three lines. 0 sends one line per vote.
  announce_window_ticks: 40

  # Played to the player when they vote. Set the particle type to none to skip it.
  effects:
    particle:
      type: happy_villager
      count: 50
      spread: [0.5, 0.9, 0.5]
      speed: 0.05
    sound:
      key: "minecraft:entity.player.levelup"
      volume: 1.0
      pitch: 1.25

pinata:
  # Places pinatas can appear. You can also save them in game with /pinatafest setspawn NAME
  # (they go into spawns.yml), and there is no limit on how many there are.
  #   fixed (the default): one exact spot. Leave out y to use the highest block.
  #   area: a random point in a rectangle, on the highest block there.
  #   zone: a random point anywhere inside a box, height included.
  locations:
    spawn:
      world: world
      x: 0.0
      y: 100.0
      z: 0.0
    # field:
    #   type: area
    #   world: world
    #   min_x: -20
    #   max_x: 20
    #   min_z: -20
    #   max_z: 20
    # sky:
    #   type: zone
    #   world: world
    #   min_x: -20
    #   max_x: 20
    #   min_y: 90
    #   max_y: 120
    #   min_z: -20
    #   max_z: 20

  # A party starts on its own after this many votes.
  auto_summon:
    # 0 turns it off.
    votes_needed: 20
    # How many pinatas appear at once.
    amount: 1
    # One of these is picked at random. Leave the list empty to pick from every spawn point.
    locations:
      - spawn

  countdown:
    enabled: true
    seconds: 5
    # Shown to everyone or only to the world the pinata appears in.
    global: true
    # A boss bar colour, or rainbow to cycle through all of them.
    color: rainbow
    style: notched_20
    sounds:
      start:
        key: "minecraft:block.note_block.bit"
        volume: 0.5
        pitch: 1.0
      tick:
        key: "minecraft:block.note_block.bit"
        volume: 0.5
        pitch: 0.8
      end:
        key: "minecraft:block.note_block.pling"
        volume: 1.0
        pitch: 0.8

  # How many hits it takes to break a pinata.
  health:
    base: 5
    # Extra hits for every player online.
    per_player: 1
    # Highest total. 0 means no limit.
    max: 0

  # A pinata that has not been broken by then disappears. 0 means never.
  life_span: 5m

  look:
    # white, creamy, brown, gray or random.
    llama_color: random
    # cycle, random, none or a colour such as pink.
    carpet: cycle
    chest: false
    glow:
      enabled: true
      # cycle, random or a colour such as gold.
      color: cycle
    particles:
      # A particle type, or none.
      type: firework
      # How many circle around the pinata every tick.
      count: 2
    # Ticks between name and boss bar updates that make the colours flow. Higher is lighter on
    # the network, 0 stops the flow. Hits always update them straight away.
    animation_ticks: 10

  # Runs away from the nearest player, or wanders when nobody is close.
  movement:
    enabled: true
    # Ticks between moves.
    interval: 20
    # How far it goes at most.
    range: 12.0
    speed: 1.4
    # Players closer than this make it run away.
    flee_radius: 6.0

  hit:
    # Seconds between hits from the same player.
    cooldown: 0.85
    # Permission needed to hit. Leave empty for everyone.
    permission: ""
    # Only these items can hit. Leave empty to allow anything, including bare hands.
    items: []
    # Only players who voted within this time can hit. 0 means anyone.
    recent_voters: 0

  # Tricks a pinata can pull after a hit. At most one per hit.
  abilities:
    teleport:
      enabled: true
      chance: 12.0
      radius: 8.0
      max_y: 6.0
      sound:
        key: "minecraft:entity.enderman.teleport"
    knockback:
      enabled: true
      chance: 12.0
      radius: 6.0
      force: 1.35
      sound:
        key: "minecraft:entity.zombie.attack_wooden_door"
    shoot_up:
      enabled: true
      chance: 8.0
      force: 1.5
      sound:
        key: "minecraft:entity.arrow.shoot"
    baby:
      enabled: true
      chance: 8.0
      min_seconds: 2.0
      max_seconds: 8.0
      in_sound:
        key: "minecraft:entity.chicken.egg"
        pitch: 1.1
      out_sound:
        key: "minecraft:entity.llama.swag"
        pitch: 0.9
    speed_up:
      # Gives speed and dolphin's grace to players nearby.
      enabled: true
      chance: 6.0
      level: 3
      radius: 12.0
      min_seconds: 2.5
      max_seconds: 5.0
      sound:
        key: "minecraft:item.trident.riptide_1"
        pitch: 1.25

  bar:
    enabled: true
    # Shown to everyone or only to the world the pinata is in.
    global: true
    color: rainbow
    style: notched_20

  hit_sound:
    key: "minecraft:block.sand.break"

  fireworks_on_death: 10
  # Give the final rewards to everyone online instead of only those who hit it.
  reward_everyone: false

# Players can choose to hide everyone else while a pinata is out.
visibility:
  enabled: true
  # Only in this world. Leave empty for any world with a pinata.
  world: ""

rewards:
  # Every vote. Each entry rolls on its own, from top to bottom.
  vote:
    thanks:
      chance: 100
      # Run one time, not once per player, and without a player name.
      once: false
      # Skip this entry for vanished players.
      ignore_vanished: true
      # Skip this entry when the vote was cast while the player was offline.
      ignore_offline: true
      # The vote_broadcast message in lang.yml already tells everyone, so nothing is said here.
      commands: []
    iron:
      chance: 75
      commands:
        - "minecraft:give %player% minecraft:iron_ingot 1"
    diamond:
      chance: 37.5
      commands:
        - "minecraft:give %player% minecraft:diamond 1"
    lucky:
      chance: 12.5
      # Pick one of the commands at random instead of running all of them.
      random_line: true
      # Stop rolling the entries below this one if this one was won.
      stop: true
      commands:
        - "minecraft:give %player% minecraft:emerald 2"
        - "minecraft:give %player% minecraft:golden_apple 1"

  # Every hit on a pinata.
  hit:
    leather:
      chance: 50
      stop: true
      commands:
        - "minecraft:give %player% minecraft:leather 1"
    iron:
      chance: 25
      commands:
        - "minecraft:give %player% minecraft:iron_ingot 1"
    diamond:
      chance: 10
      # Needs this permission.
      permission: "pinatafest.extra"
      commands:
        - "minecraft:give %player% minecraft:diamond 1"

  # For the player who lands the last hit.
  last_hit: {}

  # When a pinata breaks: for every player who hit it, and once for everybody.
  die:
    announce:
      chance: 100
      once: true
      commands:
        - "say The pinata was taken down!"
    diamonds:
      chance: 100
      commands:
        - "minecraft:give %player% minecraft:diamond 12"
    emeralds:
      chance: 33.3
      commands:
        - "minecraft:give %player% minecraft:emerald 4"
