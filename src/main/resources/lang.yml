# PinataFest - lang.yml
# Every message can be sent as chat, action bar, title or any mix, with an optional sound.
# Text supports MiniMessage as well as &a and &#RRGGBB codes.
# The PINATA prefix is written out in every message so each one can be changed on its own.

# ---- vote goal ----

vote_progress:
  # Placeholders: <player>, <count>, <needed>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#52D3FF><player> <white>voted! <#FFD068><count>/<needed> <white>votes until the next pinata."

vote_goal:
  # Placeholders: <player>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#52D3FF><player> <white>cast the vote that <#66FF83>starts the party<white>!"

party_start:
  # Placeholders: <seconds>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>A pinata party starts in <#FFD068><seconds> seconds<white>!"

countdown_bar:
  # Shown on the boss bar. Placeholders: <seconds>
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF><bold><seconds> SECONDS TILL PINATAFEST"

# ---- the pinata ----

pinata_name:
  # The name over the pinata's head and on its boss bar. Placeholders: <hits>, <max>, <plural>, <phase>
  # <phase> moves the gradient along, so the colours flow.
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF:<phase>><bold>PINATA!"

pinata_bar:
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF:<phase>><bold>PINATA: <hits> HIT<plural> LEFT"

pinata_spawn:
  # Placeholders: <x>, <y>, <z>, <world>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>A pinata just appeared at <#FFD068><x>, <y>, <z> <white>in <#52D3FF><world><white>!"
  sound:
    key: "minecraft:entity.firework_rocket.launch"
    volume: 1.0
    pitch: 1.0

pinata_die:
  # Placeholders: <player> is who landed the last hit.
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>The pinata was <#66FF83>destroyed <white>by <#52D3FF><player><white>!"
  sound:
    key: "minecraft:entity.player.levelup"
    volume: 1.0
    pitch: 1.0

pinata_expire:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>The pinata got away <#FF5484>before anyone broke it<white>."

pinata_teleport:
  # Placeholders: <x>, <y>, <z>
  enabled: true
  type: [actionbar]
  actionbar: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>The pinata teleported to <#FFD068><x>, <y>, <z><white>!"

party_over:
  # A title for players when the last pinata is gone.
  enabled: true
  type: [title]
  title: "<#FF5484><bold>PINATA DESTROYED"
  subtitle: "<white>Thanks for the <#FFD068>lovely votes"
  times: [10, 50, 10]

# ---- hitting ----

hit_left:
  # Placeholders: <hits>, <plural>
  enabled: true
  type: [actionbar]
  actionbar: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FFD068><hits> <white>hit<plural> left!"

hit_no_permission:
  enabled: true
  type: [actionbar]
  actionbar: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FF5484>You cannot hit this pinata."

hit_wrong_item:
  enabled: true
  type: [actionbar]
  actionbar: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FF5484>That is not the right item to hit it with."

hit_need_vote:
  enabled: true
  type: [actionbar]
  actionbar: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FF5484>Vote first, then you can hit the pinata!"

# ---- votes ----

queued_paid:
  # Shown on login. Placeholders: <count>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Thanks for voting while you were away! Paying out <#FFD068><count> <white>votes."

votes_self:
  # Placeholders: <votes>, <queued>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>You have voted <#FFD068><votes> <white>times, with <#52D3FF><queued> <white>waiting to be paid out."

votes_other:
  # Placeholders: <player>, <votes>, <queued>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#52D3FF><player> <white>has voted <#FFD068><votes> <white>times, with <#52D3FF><queued> <white>waiting to be paid out."

votes_console:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Use <#FFD068>/pinatafest votes NAME <white>from the console."

progress:
  # Placeholders: <count>, <needed>, <left>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FFD068><count>/<needed> <white>votes so far, <#66FF83><left> <white>to go until the next pinata."

progress_off:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Votes do not start pinatas on this server."

# ---- visibility ----

visibility_hidden:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Other players are now <#FF4361>Hidden<white> during Pinata Parties."
  sound:
    key: "minecraft:ui.button.click"
    pitch: 0.8

visibility_shown:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Other players are now <#B0FF83>Visible<white> during Pinata Parties."
  sound:
    key: "minecraft:ui.button.click"
    pitch: 1.2

visibility_status_hidden:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Other players are currently <#FF4361>Hidden<white> during Pinata Parties."

visibility_status_shown:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Other players are currently <#B0FF83>Visible<white> during Pinata Parties."

# ---- admin ----

fake_sent:
  # Placeholders: <player>, <service>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Sent a test vote for <#52D3FF><player> <white>on <#FFD068><service><white>."

summon_ok:
  # Placeholders: <location>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Starting a pinata at <#FFD068><location><white>."

summon_bad:
  # Placeholders: <location>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#FF5484>No usable location called <location><white>. Check pinata.locations in config.yml."

killed:
  # Placeholders: <count>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Removed <#FFD068><count> <white>pinatas."

reload:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>Config and messages <#66FF83>reloaded<white>."

players_only:
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>This command is <#FF5484>for players <white>only."
