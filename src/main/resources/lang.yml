# PinataFest - lang.yml
# Every message can be sent as chat, action bar, title or any mix, with an optional sound.
# Text supports MiniMessage as well as &a and &#RRGGBB codes.
# The PINATA prefix is written out in every message so each one can be changed on its own.
#
# When a new version changes the default messages, this number goes up. An older file is then
# saved as lang.yml.old and replaced, so new messages and titles are not hidden by stale text.
lang_version: 4

# ---- votes ----

vote_broadcast:
  # Told to everyone when a player votes. Placeholders: <player>
  enabled: true
  type: [chat]
  chat: "<#95FF7E><bold>VOTING</bold> <#B6C1C8>▶ <#95FF7E><player> <white>has voted for the server <#B6C1C8><click:run_command:'/vote'><hover:show_text:'<#95FF7E>Click to vote'>[/vote]</hover></click>"

vote_broadcast_multiple:
  # Used instead when a player's votes arrive together (see votes.announce_window_ticks). Placeholders: <player>, <count>
  enabled: true
  type: [chat]
  chat: "<#95FF7E><bold>VOTING</bold> <#B6C1C8>▶ <#95FF7E><player> <white>has voted <#95FF7E><count> times <white>for the server <#B6C1C8><click:run_command:'/vote'><hover:show_text:'<#95FF7E>Click to vote'>[/vote]</hover></click>"

# ---- vote goal ----

vote_progress:
  # Placeholders: <player>, <count>, <needed>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#52D3FF><player> <white>voted! <#FFD068><count>/<needed> <white>votes until the next pinata."

vote_goal:
  # Placeholders: <player>
  enabled: true
  type: [chat]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <#52D3FF><player> <white>cast the vote that <#66FF83>starts the party<white>!"

party_start:
  # Placeholders: <seconds>
  enabled: true
  type: [chat, title]
  title: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF><bold>PINATA PARTY"
  subtitle: "<white>Starting in <#FFD068><seconds> seconds"
  times: [0, 25, 5]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>A pinata party starts in <#FFD068><seconds> seconds<white>!"

party_tick:
  # Shown once every second of the countdown after the first, so the title counts 5, 4, 3, 2, 1. Placeholders: <seconds>
  enabled: true
  type: [title]
  title: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF><bold>PINATA PARTY"
  subtitle: "<white>Starting in <#FFD068><seconds>"
  times: [0, 25, 5]

countdown_bar:
  # Shown on the boss bar. Placeholders: <seconds>
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF><bold><seconds> SECONDS TILL PINATAFEST"

# ---- the pinata ----

pinata_name:
  # The name over the pinata's head and on its boss bar. Placeholders: <hits>, <max>, <plural>, <phase>
  # <phase> moves the gradient along, so the colours flow.
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF:<phase>><bold>PINATA!"

pinata_bar:
  enabled: true
  type: [chat]
  chat: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF:<phase>><bold>PINATA: <hits> HIT<plural> LEFT"

pinata_spawn:
  # Placeholders: <x>, <y>, <z>, <world>
  enabled: true
  type: [chat, title]
  title: "<gradient:#FF5484:#FFD068:#B3E876:#66FF83:#52D3FF:#B87CFF><bold>PINATA!"
  subtitle: "<white>Use <#FFD068>/warp pinata <white>to find it!"
  times: [0, 50, 10]
  chat: "<#FF5484><bold>P</bold><#FFD068><bold>I</bold><#B3E876><bold>N</bold><#66FF83><bold>A</bold><#52D3FF><bold>T</bold><#B87CFF><bold>A</bold> <#B6C1C8>⏵ <white>A pinata just appeared at <#FFD068><x>, <y>, <z> <white>in <#52D3FF><world><white>!"
  sound:
    key: "minecraft:entity.firework_rocket.launch"
    volume: 1.0
    pitch: 1.0

